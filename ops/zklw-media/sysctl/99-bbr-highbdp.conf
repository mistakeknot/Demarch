# Jellyfin serves clients ~250 ms away (Hetzner DE -> US home).
#
# NOT PROVEN TO HELP HERE, and the record should say so. A before/after test on
# 2026-07-30 suggested bbr tripled single-stream throughput (cubic 17.2 Mbps ->
# bbr 48-57 Mbps). That was wrong. An interleaved A/B run afterwards showed
# cubic and bbr performing identically -- 0.1-0.3 Mbps each, alternating. The
# first test measured the path changing under it, not the algorithm.
#
# The real constraint is congested transatlantic transit, Charter -> Lumen ->
# Colt -> Hetzner, entirely outside this machine. Same house, back to back,
# Tailscale not involved:
#     cachefly (US CDN)                 94 Mbps
#     nbg1-speed.hetzner.com (DE)        0.085 Mbps
# It is worst during US evening peak, which is when anyone actually watches
# anything. See ops/zklw-media/library/README.md for the full workup.
#
# bbr is kept because it is defensible on its own terms for a 250 ms path and
# does no harm -- not because it fixed anything. Re-test interleaved, never
# before/after, once transit is healthy.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Bandwidth-delay product at 250 ms x 100 Mbps is ~3.1 MB, so the stock 4 MB
# ceiling is only just adequate and the 208 KB core max throttles anything that
# sets SO_SNDBUF explicitly. 16 MB leaves room for the window to actually open.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
