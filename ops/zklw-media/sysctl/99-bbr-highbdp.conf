# Jellyfin serves clients ~250 ms away (Hetzner DE -> US home). On a path that
# long, the congestion-control algorithm is the throughput ceiling, not the link.
#
# Measured 2026-07-30, 60 MB pull through Jellyfin over Tailscale:
#   cubic, single stream    17.2 Mbps      <- clients capped here and transcoded
#   cubic, 4 streams        58.4 Mbps      <- path was never the limit
#   bbr,   single stream    48-57 Mbps     <- 3x, no hardware change
#
# 25.8 Mbps 4K HDR files now direct-play instead of forcing a tone-mapping
# transcode on a box with no GPU.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Bandwidth-delay product at 250 ms x 100 Mbps is ~3.1 MB, so the stock 4 MB
# ceiling is only just adequate and the 208 KB core max throttles anything that
# sets SO_SNDBUF explicitly. 16 MB leaves room for the window to actually open.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
