# ======================================================================
# zklw media server stack
#
#   Jellyfin   - playback        (the Netflix-like front end)
#   Jellyseerr - request portal  (what users touch: "I want this movie")
#   Radarr     - movie automation (search/score/import state machine)
#   Sonarr     - TV automation    (same, for shows; remove if movies-only)
#   Prowlarr   - indexer manager  (your private tracker + Usenet, one place)
#   qBittorrent- torrent client
#   SABnzbd    - usenet client
#
# SECURITY: every service binds ONLY to ${TS_BIND} (zklw's Tailscale IP).
# Nothing is published on 0.0.0.0, so nothing is reachable from the public
# internet — only devices on your tailnet.
#
# HARDLINKS: every service mounts the SAME ${MEDIA_ROOT} at /data, so
# Radarr/Sonarr import via instant hardlinks (no cross-filesystem copies).
# Do NOT give qBittorrent /data/downloads and Radarr /movies as separate
# mounts — that breaks hardlinking. One shared /data root is the trick.
# ======================================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}:/data
      - ${CACHE_ROOT:-/cache}/jellyfin:/cache
    ports:
      - "${TS_BIND}:${JELLYFIN_PORT}:8096"
    restart: unless-stopped
    # Transcode scratch in RAM. /data is RAID5 across four spinning disks that
    # also serve playback reads and the KG rsync, so writing segments there
    # contends with the very stream being transcoded. There is no SSD in this
    # box (md2 and md3 share the same four spindles), so tmpfs is the only
    # place that is genuinely faster.
    tmpfs:
      - /transcodes:size=12g,mode=1777
    # No GPU on zklw (ASPEED BMC only) — the 5950X handles CPU transcode.

  # Overseerr + Jellyseerr merged into "Seerr" (seerr-team/seerr) in early 2026.
  # Migrated 2.7.3 -> 3.3.0 on 2026-07-08. Image moved fallenbagel/jellyseerr ->
  # ghcr.io/seerr-team/seerr; config path /app/config UNCHANGED; DB auto-migrates
  # on first boot (one-way — back up config first). GOTCHA: 3.x runs as node
  # (UID 1000), old 2.x wrote config as root -> EACCES crash-loop on the logs
  # dir. Fix: chown config tree to the run-UID + pin `user:` + `init: true`.
  #
  # 3.3.0 -> 3.4.1 on 2026-08-03. A SECURITY update, not a feature one: 3.4.0
  # patches GHSA-mc6w-69r3-62h8, path traversal -> RCE in the avatar ImageProxy.
  # Exposure here was low (both vectors need prior access: a compromised
  # Jellyfin returning a crafted response, or MITM on a connection that runs
  # over the internal docker bridge) but it is still RCE. Two fixes in the same
  # pair matter more day to day for this estate, which routinely de-registers
  # and re-imports media: "don't delete requests when removing media from arr"
  # and "decline orphaned requests when media is removed from servarr".
  # Clean update, no EACCES recurrence, 50 requests / 3 users / arr links intact.
  # Config backed up first to backups/jellyseerr-config-*.tar.gz — the DB
  # migration is still one-way, so that backup is the only route back.
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    user: "${PUID}:${PGID}"       # match chowned config (was root under 2.x)
    init: true                    # 3.x expects an init to reap the node process
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "${TS_BIND}:${JELLYSEERR_PORT}:5055"
    restart: unless-stopped
    depends_on:
      - jellyfin
      - radarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data      # <-- shared root = hardlink imports
    ports:
      - "${TS_BIND}:${RADARR_PORT}:7878"
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "${TS_BIND}:${SONARR_PORT}:8989"
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent

  # Fetches EXTERNAL .srt files. 89 films carry ONLY image subtitles
  # (PGS/VOBSUB), which Jellyfin can display only by BURNING THEM INTO the
  # video -- a full re-encode, on a box with no GPU. A text subtitle sitting
  # next to the file is rendered by the client for free instead.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}:/data      # same root as the arrs, so paths line up
    ports:
      - "${TS_BIND}:${BAZARR_PORT:-6767}:6767"
    restart: unless-stopped
    depends_on:
      - radarr
      - sonarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "${TS_BIND}:${PROWLARR_PORT}:9696"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/data      # downloads land under /data/downloads
    ports:
      - "${TS_BIND}:${QBITTORRENT_PORT}:8080"
      - "${QBITTORRENT_BT_PORT}:6881"       # BT listen port (TCP)
      - "${QBITTORRENT_BT_PORT}:6881/udp"   # BT listen port (UDP)
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - ${MEDIA_ROOT}:/data
    ports:
      - "${TS_BIND}:${SABNZBD_PORT}:8080"
    restart: unless-stopped

  # ====================================================================
  # INTAKE BOT (see DESIGN.md Part 1 + intake_bot/README.md). The routing
  # brain: Discord/Telegram/email request → resolve (TMDB fast-path or Claude
  # Haiku ranker) → dispatch through Seerr. No published ports — it only makes
  # OUTbound calls (to Discord/Telegram/IMAP and to Seerr on the internal net),
  # so nothing to bind. Secrets resolved in-process via `op run` (the image's
  # entrypoint); the only thing mounted is the read-only service-account token.
  # ====================================================================
  intake-bot:
    build:
      context: .
      dockerfile: intake_bot/Dockerfile
    container_name: intake-bot
    environment:
      - TZ=${TZ}
      # op reads this to authenticate the service account, then resolves the
      # op:// refs in bot.env.tpl. The token file is root-600 on the host.
      - OP_SERVICE_ACCOUNT_TOKEN_FILE=/run/secrets/op_token
    secrets:
      - op_token
    restart: unless-stopped
    depends_on:
      - jellyseerr   # dispatch target (Seerr). Rename if you switch the image.

  # ====================================================================
  # RATIO ENGINE (see DESIGN.md Part 2). Enable AFTER the base stack works.
  # ORDER MATTERS: bring up qbit_manage (the HnR firewall) BEFORE/with
  # cross-seed, never cross-seed alone. cross-seed needs the SAME /data mount
  # as qBittorrent + the *arrs or hardlinks fail.
  # ====================================================================

  # cross-seed: seeds one downloaded file to N trackers (ratio multiplier).
  # Matches content you already have against your other trackers' indexers.
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6
    container_name: cross-seed
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/cross-seed:/config
      - ${MEDIA_ROOT}:/data        # MUST match qBittorrent's mount (hardlinks)
    command: daemon
    ports:
      - "${TS_BIND}:2468:2468"     # webhook/RSS endpoint, tailnet-only
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr
    # First run: `docker compose run --rm cross-seed gen-config`, then edit
    # /config/config.js — set torrentClients (qbittorrent), torznab (each
    # Prowlarr indexer's /<id>/api?apikey=...), linkType: hardlink,
    # matchMode: partial, linkCategory (keep cross-seeds out of *arr import).

  # qbit_manage: the ONLY thing allowed to remove torrents. Enforces
  # per-tracker min_seeding_time so cleanup never causes a Hit-and-Run.
  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:latest
    container_name: qbit-manage
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - QBT_RUN=true
      - QBT_SCHEDULE=30          # run every 30 min
    volumes:
      - ${CONFIG_ROOT}/qbit-manage:/config
      - ${MEDIA_ROOT}:/data
    restart: unless-stopped
    depends_on:
      - qbittorrent
    # Configure config.yml `share_limits` groups: one per tracker tag, each
    # with min_seeding_time >= that tracker's HnR floor (TL: start 10 days).
    # Set qBittorrent's OWN share limits to pause-only / -1 so they NEVER
    # delete — qbit_manage owns removal. See DESIGN.md "ratio-vs-cleanup
    # firewall".

  # autobrr: OPT-IN racing tier. Monitors tracker IRC #announce channels to
  # grab new uploads in ~1s (early seeders win the most ratio). Leave this
  # commented until seed-time floors are proven safe; RSS is the baseline.
  # autobrr:
  #   image: ghcr.io/autobrr/autobrr:latest
  #   container_name: autobrr
  #   environment:
  #     - TZ=${TZ}
  #   volumes:
  #     - ${CONFIG_ROOT}/autobrr:/config
  #   ports:
  #     - "${TS_BIND}:7474:7474"
  #   restart: unless-stopped
  #   depends_on:
  #     - qbittorrent

# The 1Password service-account token, mounted read-only into intake-bot only.
# Create it root-600 first: see agent/secrets-1password.md step 3
#   sudo install -m 600 /dev/stdin /etc/zklw-media/op-token <<< 'ops_…'
secrets:
  op_token:
    file: ${OP_TOKEN_FILE:-/etc/zklw-media/op-token}

# Bind mounts are used for all persistent state (under ${CONFIG_ROOT} and
# ${MEDIA_ROOT}); no named volumes needed. This keeps everything visible on
# the host filesystem and trivially backup-able to your home NAS.
