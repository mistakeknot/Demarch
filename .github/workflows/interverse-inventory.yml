name: Interverse inventory

on:
  push:
    paths:
      - ".github/workflows/interverse-inventory.yml"
      - "core/marketplace/.claude-plugin/marketplace.json"
      - "interverse/**"
      - "os/Clavain/agent-rig.json"
      - "scripts/check-rig-drift.sh"
      - "scripts/gen-interverse-inventory.py"
      - "scripts/interverse_inventory.py"
      - "tests/test_interverse_inventory.py"
  pull_request:
    paths:
      - ".github/workflows/interverse-inventory.yml"
      - "core/marketplace/.claude-plugin/marketplace.json"
      - "interverse/**"
      - "os/Clavain/agent-rig.json"
      - "scripts/check-rig-drift.sh"
      - "scripts/gen-interverse-inventory.py"
      - "scripts/interverse_inventory.py"
      - "tests/test_interverse_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Generate and check inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run inventory tests
        run: python3 -m pytest tests/test_interverse_inventory.py -q

      # This gate has been silently false on every cloud run. The monorepo
      # .gitignore's os/, core/ and interverse/, so actions/checkout never
      # materialises them and none of the steps below have executed — the job
      # went green having checked nothing but the inventory unit tests.
      #
      # The gate itself is right: these steps genuinely cannot run without the
      # plugins. What was wrong is that skipping looked identical to passing.
      # Now it announces itself.
      - name: Detect full local skeleton
        id: skeleton
        run: |
          if [ -f os/Clavain/agent-rig.json ] && [ -d interverse ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "skeleton present: running drift and inventory checks"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Inventory checks skipped::os/ and interverse/ are gitignored, so this checkout has no plugins. Rig-drift and inventory generation did NOT run. Estate checks must run on a materialised local checkout."
            {
              echo "### Interverse inventory — checks skipped"
              echo
              echo "\`os/Clavain/agent-rig.json\` and/or \`interverse/\` are absent."
              echo "They are gitignored, so a cloud checkout never has them and"
              echo "**rig-drift and inventory generation did not run.**"
              echo
              echo "This job passing does not mean the estate is clean."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check high-severity manifest and rig drift
        if: steps.skeleton.outputs.full == 'true'
        run: scripts/check-rig-drift.sh --json

      - name: Generate inventory artifact
        if: steps.skeleton.outputs.full == 'true'
        run: scripts/gen-interverse-inventory.py

      - name: Upload inventory artifact
        if: steps.skeleton.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: interverse-inventory
          path: .interwatch/interverse-inventory.json
